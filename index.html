<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سِمُو | الثانوية الثالثة والأربعون</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:#fbf8f0;color:#123f56}
header{height:85px;background:#fff;box-shadow:0 2px 12px #0002;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:10}
.logo{width:65px;height:65px;object-fit:contain;border-radius:50%}
.title{text-align:center}.title small{display:block;color:#557080;font-size:13px}.title b{font-size:28px}
.menu{width:45px;height:45px;border:0;border-radius:10px;background:#123f56;color:#fff;font-size:24px}
.hero{min-height:calc(100vh - 85px);display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.hero h1{font-size:80px;margin-bottom:10px}.hero h2{color:#176f98;font-size:28px;margin-bottom:20px}
.hero p{font-size:19px;color:#557080;max-width:700px;line-height:2;margin:auto}
.btn{display:inline-block;margin-top:30px;padding:13px 28px;border-radius:12px;background:#123f56;color:white;text-decoration:none;font-weight:bold}
.drawer{position:fixed;right:-330px;top:0;width:320px;height:100vh;background:white;z-index:30;padding:30px;box-shadow:-5px 0 25px #0003;transition:.3s}
.drawer.open{right:0}.drawer img{width:60px;height:60px;object-fit:contain}
.close{float:left;border:0;background:#eee;border-radius:8px;width:40px;height:40px;font-size:24px}
nav{clear:both;padding-top:35px}nav a{display:block;text-decoration:none;color:#123f56;padding:14px;border-radius:10px;margin:6px 0;font-weight:bold}
nav a:hover{background:#e8f2f0;color:#176f98}
.overlay{position:fixed;inset:0;background:#0007;z-index:20;display:none}.overlay.open{display:block}
footer{text-align:center;background:#123f56;color:#fff;padding:20px}
</style>
</head>
<body>
<header>
<a href="index.html"><img class="logo" src="Images/logo1.jpg" alt="شعار سِمُو"></a>
<div class="title"><small>الثانوية الثالثة والأربعون</small><b>سِمُو</b></div>
<button class="menu" onclick="openMenu()">☰</button>
</header>
<div id="overlay" class="overlay" onclick="closeMenu()"></div>
<aside id="drawer" class="drawer">
<button class="close" onclick="closeMenu()">×</button>
<img src="Images/logo1.jpg" alt="شعار سِمُو">
<nav>
<a href="index.html">الرئيسية</a>
<a href="about.html">عن سِمُو</a>
<a href="impact.html">نبي أثر</a>
<a href="initiatives.html">المبادرات</a>
<a href="gallery.html">معرض الأنشطة</a>
<a href="contact.html">معلومات الموقع</a>
</nav>
</aside>
<main><section class="hero"><div>
<h1>سِمُو</h1>
<h2>رؤية وبناء .. من فكرة إلى إنجاز</h2>
<p>الثانوية الثالثة والأربعون — منصة تعليمية لإبراز التميز والإبداع وتوثيق الأنشطة والمبادرات.</p>
<a class="btn" href="about.html">اكتشفي سِمُو</a>
</div></section></main>
<footer>الثانوية الثالثة والأربعون — سِمُو</footer>
<script>
function openMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('open')}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
</script>
</body>
</html>
